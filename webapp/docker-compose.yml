services:
  backend:
    build: ./backend
    container_name: nemwem-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend/app:/app/app:ro          # hot-reload source edits
      - backend_data:/app/data             # SQLite persists across restarts
    environment:
      # API process: scrapers run in the separate `scheduler` service below, so
      # a write stall can never freeze this process. Reads use WAL (concurrent
      # with the scheduler's writes across processes).
      - RUN_SCHEDULER=0
      # Optional Amber Electric third-party forecast. Leave unset to hide the
      # Amber line; set the token in a .env file (never committed) to light it
      # up. The API process reads it for the /api/forecast/series live call.
      - AMBER_API_TOKEN=${AMBER_API_TOKEN:-}
      - AMBER_SITE_ID=${AMBER_SITE_ID:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Dedicated scraper process — the ONLY SQLite writer. Shares the same DB
  # volume; WAL lets the API service read concurrently. A write deadlock here
  # is isolated to this process (watchdog restarts it) and never touches the API.
  scheduler:
    build: ./backend
    container_name: nemwem-scheduler
    volumes:
      - ./backend/app:/app/app:ro
      - backend_data:/app/data
    environment:
      # Same Amber passthrough as the API: the scheduler reads it when logging
      # the day-ahead forecast vintage so Amber gets scored too.
      - AMBER_API_TOKEN=${AMBER_API_TOKEN:-}
      - AMBER_SITE_ID=${AMBER_SITE_ID:-}
    command: python -m app.run_scheduler
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nemwem-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
      - CHOKIDAR_USEPOLLING=true           # filesystem events on macOS bind mount
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
